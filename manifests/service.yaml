apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello
  namespace: default
spec:
  template:
    metadata:
      annotations:
        # Demo-friendly autoscaling: scale to zero quickly, scale up at low load.
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "5"
        autoscaling.knative.dev/target: "10"             # 10 concurrent requests per pod
        autoscaling.knative.dev/scale-down-delay: "30s"  # short delay so scale-to-zero is visible during the talk
    spec:
      containerConcurrency: 50
      timeoutSeconds: 30
      containers:
        - image: dev.local/knative-poc-hello:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
