name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Go unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false  # zero external deps, so no go.sum and nothing to cache
      - run: go vet ./...
      - run: go test -v ./...
